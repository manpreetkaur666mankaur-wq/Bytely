<!DOCTYPE html>
<html lang="en"><head><meta name="google-site-verification" content="BG26A7_Hd6xG3ZNA2fMDhABWv0miccmhIPUDKmV4xZU" />
<title>Bytely – Learn computer skills and coding</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F6F5FF;--surface:#fff;--ink:#14123A;--mute:#55537d;--line:#dcd9f5;--brand:#3D4BFF;--on:#fff;--sun:#FFC933;--ok:#0B7A55;--bad:#C2255C;--code:#14123A;--ci:#e9e8ff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0C27;--surface:#16143D;--ink:#EEEDFF;--mute:#a3a1d0;--line:#2a2766;--brand:#8D96FF;--on:#0D0C27;--ok:#3DD9A0;--bad:#FF7AA8;--code:#0A091D}}
:root[data-theme="dark"]{--bg:#0D0C27;--surface:#16143D;--ink:#EEEDFF;--mute:#a3a1d0;--line:#2a2766;--brand:#8D96FF;--on:#0D0C27;--ok:#3DD9A0;--bad:#FF7AA8;--code:#0A091D}
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.6 "Bricolage Grotesque",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:900px;margin:0 auto;padding:0 18px 50px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;align-items:center;gap:12px;height:56px;padding-bottom:0}
.logo{font-weight:800;font-size:22px;margin-right:auto;border:0;background:none;color:var(--ink);padding:0}
.logo b{color:var(--brand)}
.chip{font:600 13px "JetBrains Mono",monospace;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:var(--on);border:0;border-radius:10px;padding:12px 20px;font-weight:700;margin:4px 6px 4px 0}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible,textarea:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1{font-size:clamp(34px,7vw,56px);line-height:1.05;letter-spacing:-.03em;margin:36px 0 14px;font-weight:800}
h2{font-size:28px;margin:30px 0 6px;letter-spacing:-.02em}h3{font-size:21px;margin:26px 0 6px}
.hero p,.sub{color:var(--mute);font-size:19px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:16px}
.card strong{display:block;font-size:21px}.card span{display:block;color:var(--mute);font-size:15px}.card em{font-style:normal;color:var(--ok);font-weight:700;font-size:14px}
.c0{--c:#2B5EE8}.c1{--c:#1E8E5A}.c2{--c:#D8481F}.c3{--c:#E8A400}.c4{--c:#5B6CFF}.c5{--c:#8A4FFF}.c6{--c:#E34F26}.c7{--c:#0E8FA8}.c8{--c:#D4A800}
.list{display:grid;gap:10px}
.item{text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:600}
.item b{display:inline-block;min-width:28px;color:var(--brand)}
pre{margin:0 0 14px;padding:14px;border-radius:12px;background:var(--code);color:var(--ci);font:15px/1.6 "JetBrains Mono",monospace;white-space:pre-wrap;overflow-x:auto}
.outp{border-left:4px solid var(--ok)}
textarea{width:100%;height:170px;margin-bottom:10px;background:var(--code);color:var(--ci);border:1.5px solid var(--line);border-radius:12px;padding:14px;font:15px/1.6 "JetBrains Mono",monospace}
.steps{padding-left:22px}.steps li{margin:12px 0}.steps input{width:20px;height:20px;vertical-align:-4px;margin-right:8px}
.ok{color:var(--ok);font-weight:800;font-size:20px;margin:14px 0 6px}.bad{color:var(--bad);font-weight:700;margin:14px 0}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px}
summary{font-weight:700;cursor:pointer}ul{margin:8px 0 0;padding-left:20px;color:var(--mute)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.links a{color:var(--brand);font-weight:700;border:1.5px solid var(--brand);border-radius:10px;padding:8px 14px;text-decoration:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.wrap{max-width:1000px}
.k-word{--c:#2B5EE8}.k-excel{--c:#1E8E5A}.k-ppt{--c:#D8481F}.k-py{--c:#B7791F}.k-c{--c:#5B6CFF}.k-cpp{--c:#8A4FFF}.k-html{--c:#E34F26}.k-css{--c:#1C7ED6}.k-sql{--c:#0E8FA8}.k-js{--c:#9C7A00}
.badge{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:10px;background:var(--c);color:#fff;font:700 14px "JetBrains Mono",monospace}
.badge.big{min-width:68px;height:68px;font-size:24px;border-radius:18px}
.hero2{background:linear-gradient(135deg,#1b1760 0%,#3D4BFF 62%,#7B3FF2 100%);color:#fff;border-radius:24px;padding:36px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;margin-top:22px}
.hero2 h1{color:#fff;margin:12px 0}.hero2 p{color:#dcdcff;font-size:19px;margin:0 0 16px}
.pill{display:inline-block;background:rgba(255,255,255,.16);border-radius:99px;padding:4px 14px;font-size:14px!important;font-weight:700;margin:0}
.btn.sun{background:#FFC933;color:#14123A}.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.stats{display:flex;gap:26px;margin-top:18px}.stats b{display:block;font-size:30px;line-height:1}.stats span{font-size:14px;color:#c9c9ff}
.win{background:#0A091D;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.win .dots{display:flex;gap:7px;padding:12px 14px;background:rgba(255,255,255,.07)}.win .dots i{width:11px;height:11px;border-radius:50%;background:#FFC933}.win .dots i:first-child{background:#ff6b8b}.win .dots i:last-child{background:#5be0a8}
.win pre{margin:0;border-radius:0;font-size:15px;color:#e9e8ff}.win .res{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);color:#5be0a8;font-weight:700}
.sec{display:flex;align-items:baseline;gap:12px;margin:40px 0 4px}.sec h2{margin:0}.sec span{color:var(--mute)}
.card{display:flex;flex-direction:column;gap:6px;border-top-width:1.5px;border-left:6px solid var(--c);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(61,75,255,.15)}
.card span.badge{display:inline-grid;color:#fff;font-size:14px;line-height:1;margin-bottom:4px;align-self:flex-start}.card .go{color:var(--c);font-weight:800;margin-top:auto;padding-top:6px}
progress{width:100%;height:9px;border-radius:9px;accent-color:var(--c,var(--brand))}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:14px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}.how b{font-size:19px;display:block}.how span{color:var(--mute)}
.banner{display:flex;gap:18px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-left:8px solid var(--c);border-radius:18px;padding:20px;margin:16px 0}
.banner h2{margin:0}.banner p{margin:2px 0 10px;color:var(--mute)}.banner>div{flex:1}.banner small{color:var(--mute)}
.crumb{display:flex;align-items:center;gap:10px;font-weight:700;margin:14px 0 8px}
.item{display:flex;align-items:center;gap:10px}.item:hover{border-color:var(--brand)}
footer.f{text-align:center;color:var(--mute);margin-top:50px;font-size:15px}
@media(max-width:760px){.hero2{grid-template-columns:1fr;padding:24px}.banner{flex-direction:column;align-items:flex-start}}

/* ===== Student accounts (added) : dark forest-green screens ===== */
[hidden]{display:none!important}
.grecaptcha-badge{visibility:hidden}
.hbtn,.avbtn{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;font-weight:800;padding:0;font-size:16px;line-height:1}
.avbtn{background:linear-gradient(135deg,#1fa56b,#0d5a3b);color:#eafff3;border-color:transparent;font-size:13px;letter-spacing:.3px}
.fg,.fgd,.fg-modal{--g0:#04120c;--g1:#082419;--gl:rgba(125,214,170,.22);--gt:#e9f7ef;--gm:#9cbfae;--ga:#3ddc97;--ga2:#1fb978;--gon:#03210f;--gw:#ffcf5c;--ge:#ff8fa0}
.fg{position:fixed;inset:0;z-index:100;overflow-y:auto;color:var(--gt);background:radial-gradient(1000px 620px at 8% -10%,#0f5035 0%,transparent 60%),radial-gradient(900px 600px at 105% 0,#0b3d30 0%,transparent 62%),linear-gradient(160deg,var(--g1),var(--g0));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-overflow-scrolling:touch}
.fg-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.fg-orb{position:absolute;border-radius:50%;filter:blur(8px);opacity:.55;animation:fgf 14s ease-in-out infinite}
.fg-orb.o1{width:340px;height:340px;left:-90px;top:-80px;background:radial-gradient(circle,#1c7a55,transparent 70%)}
.fg-orb.o2{width:420px;height:420px;right:-140px;top:30%;background:radial-gradient(circle,#127a62,transparent 70%);animation-delay:-5s}
.fg-orb.o3{width:300px;height:300px;left:25%;bottom:-120px;background:radial-gradient(circle,#2a9a5c,transparent 70%);animation-delay:-9s}
.fg-sym{position:absolute;font:600 15px "JetBrains Mono",monospace;color:#8fe9bd;opacity:.22;border:1px solid rgba(143,233,189,.35);border-radius:10px;padding:6px 10px;animation:fgs 9s ease-in-out infinite;font-style:normal}
.fg-sym.s1{left:6%;top:16%}.fg-sym.s2{right:8%;top:12%;animation-delay:-2s}.fg-sym.s3{left:10%;bottom:14%;animation-delay:-4s}.fg-sym.s4{right:12%;bottom:18%;animation-delay:-6s}.fg-sym.s5{left:46%;top:6%;animation-delay:-3s}.fg-sym.s6{right:30%;bottom:6%;animation-delay:-7s}
@keyframes fgf{50%{transform:translate(24px,-18px) scale(1.06)}}
@keyframes fgs{50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes fgin{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fgspin{to{transform:rotate(360deg)}}
@keyframes fgshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fg-wrap{position:relative;min-height:100%;display:grid;grid-template-rows:1fr auto;place-items:center;padding:28px 16px 12px}
.fg-card{width:min(100%,470px);background:linear-gradient(180deg,rgba(16,52,37,.86),rgba(8,32,22,.9));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--gl);border-radius:26px;padding:30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);animation:fgin .5s cubic-bezier(.2,.8,.2,1) both}
.fg-card.wide{width:min(100%,1000px);display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;padding:42px}
.fg-card.reg{width:min(100%,640px)}
.fg-card.int{width:min(100%,760px)}
.fg-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;color:var(--gt);margin-bottom:18px}
.fg-logo b{color:var(--ga)}
.fg-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--ga),#139a63);color:var(--gon);font-weight:800}
.fg h1,.fg h2{margin:0 0 8px;line-height:1.1;letter-spacing:-.025em;color:var(--gt)}
.fg h1{font-size:clamp(32px,6vw,52px)}.fg h2{font-size:28px}
.fg h1 em{font-style:normal;background:linear-gradient(90deg,#7df0b9,#3ddc97 60%,#c9ff8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.fg p{color:var(--gm);margin:0 0 16px;font-size:16.5px}
.fg-chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.fg-chip{font:600 12.5px "JetBrains Mono",monospace;color:#bff5d9;border:1px solid var(--gl);background:rgba(61,220,151,.08);padding:6px 11px;border-radius:99px}
.fg-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:17px;color:var(--gon);background:linear-gradient(135deg,#6af0b2,var(--ga) 55%,#20b974);box-shadow:0 10px 28px rgba(61,220,151,.28);transition:transform .15s,box-shadow .15s,filter .15s;margin:6px 0 0}
.fg-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(61,220,151,.38)}.fg-btn:active{transform:translateY(1px)}
.fg-btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.fg-btn.ghost{background:transparent;color:var(--gt);border:1.5px solid var(--gl);box-shadow:none}
.fg-btn.ghost:hover{border-color:var(--ga)}
.fg-btn.auto{width:auto}
.fg-btn.busy::after{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(3,33,15,.35);border-top-color:var(--gon);animation:fgspin .7s linear infinite}
.fg-link{background:none;border:0;color:var(--ga);font-weight:700;padding:2px 0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.fg-link[disabled]{color:var(--gm);text-decoration:none;cursor:default}
.fg label.l{display:block;font-weight:700;font-size:14px;color:#cdeedd;margin:14px 0 6px}
.fg label.l small{font-weight:500;color:var(--gm)}
.fg input[type=text],.fg input[type=tel],.fg select,.fg textarea,.fg input.ro{width:100%;background:rgba(255,255,255,.05);color:var(--gt);border:1.5px solid var(--gl);border-radius:13px;padding:13px 14px;font:inherit;font-size:16.5px;transition:border-color .15s,box-shadow .15s,background .15s}
.fg select option{color:#0b2a1c}
.fg textarea{min-height:92px;resize:vertical}
.fg input::placeholder,.fg textarea::placeholder{color:#6f9a85}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--ga);box-shadow:0 0 0 4px rgba(61,220,151,.18);background:rgba(255,255,255,.07)}
.fg input.ro{color:#bff5d9;background:rgba(61,220,151,.07);border-style:dashed}
.fg .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg .phone{display:grid;grid-template-columns:128px 1fr;gap:10px}
.fg .count{float:right;font:500 12px "JetBrains Mono",monospace;color:var(--gm)}
.fg-seg{display:flex;flex-wrap:wrap;gap:8px}
.fg-seg label{position:relative;cursor:pointer}
.fg-seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.fg-seg span{display:block;padding:10px 16px;border:1.5px solid var(--gl);border-radius:12px;font-weight:700;color:var(--gm);transition:all .15s;background:rgba(255,255,255,.03)}
.fg-seg input:checked+span{color:var(--gon);background:linear-gradient(135deg,#6af0b2,var(--ga));border-color:transparent;box-shadow:0 6px 16px rgba(61,220,151,.25)}
.fg-seg input:focus-visible+span{outline:3px solid var(--gw);outline-offset:2px}
.fg-err{display:none;margin:14px 0 0;padding:11px 14px;border-radius:12px;background:rgba(255,143,160,.1);border:1px solid rgba(255,143,160,.4);color:var(--ge);font-weight:600;font-size:15px}
.fg-err.on{display:block;animation:fgshake .4s}
.fg-note{display:none;margin:14px 0 0;padding:11px 14px;border-radius:12px;background:rgba(61,220,151,.1);border:1px solid var(--gl);color:#bff5d9;font-size:15px}
.fg-note.on{display:block}
.fg-warn{margin:16px 0 0;padding:14px 16px;border-radius:14px;background:rgba(255,207,92,.09);border:1px solid rgba(255,207,92,.4);color:#ffe9a8;font-size:15px}
.fg-warn b{color:var(--gw)}
.fg-otp{display:flex;gap:9px;justify-content:center;margin:20px 0 8px}
.fg-otp input{width:100%;max-width:54px;aspect-ratio:1/1.12;text-align:center;font:700 24px "JetBrains Mono",monospace!important;padding:0!important;border-radius:14px!important}
.fg-timer{text-align:center;color:var(--gm);font-size:15px;margin:12px 0 0}
.fg-check{display:flex;gap:10px;align-items:flex-start;margin:18px 0 4px;color:var(--gm);font-size:15px;line-height:1.45}
.fg-check input{width:20px;height:20px;margin-top:2px;accent-color:#3ddc97;flex:none}
.fg-verified{display:inline-flex;align-items:center;gap:6px;color:var(--ga);font-weight:800;font-size:13px;margin-left:8px}
.fg-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.fg-back{background:none;border:0;color:var(--gm);font-weight:700;padding:4px 0;font-size:15px}
.fg-back:hover{color:var(--ga)}
.fg-steps{display:flex;gap:6px;margin:0 0 16px}
.fg-steps i{height:5px;flex:1;border-radius:9px;background:rgba(255,255,255,.12)}
.fg-steps i.on{background:linear-gradient(90deg,#6af0b2,var(--ga))}
.fg-foot{position:relative;color:#6f9a85;font-size:13px;text-align:center;margin:14px 0 8px}
.fg-foot .fg-link{font-size:13px;color:#8fe9bd}
.fg-win{background:#030c08;border:1px solid var(--gl);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.fg-win .d{display:flex;gap:7px;padding:12px 14px;background:rgba(255,255,255,.06)}.fg-win .d i{width:11px;height:11px;border-radius:50%;background:#ffcf5c}.fg-win .d i:first-child{background:#ff7a93}.fg-win .d i:last-child{background:#5be0a8}
.fg-win pre{margin:0;padding:16px 18px;border:0;border-radius:0;background:none;color:#cdeedd;font:14.5px/1.7 "JetBrains Mono",monospace;white-space:pre-wrap}
.fg-win pre b{color:#7df0b9}.fg-win pre u{text-decoration:none;color:#ffcf5c}.fg-win pre s{text-decoration:none;color:#6f9a85}
.fg-win .r{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);color:#5be0a8;font-weight:700}
.fg-win .r::after{content:"▍";color:var(--ga);animation:fgblink 1s steps(1) infinite}
@keyframes fgblink{50%{opacity:0}}
.fg-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:14px 0 4px}
.fg-tile{position:relative;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:rgba(255,255,255,.04);color:var(--gt);border:1.5px solid var(--gl);border-radius:16px;padding:13px;transition:all .18s}
.fg-tile:hover{transform:translateY(-2px);border-color:rgba(61,220,151,.6)}
.fg-tile strong{font-size:17px;line-height:1.1}.fg-tile small{grid-column:2;color:var(--gm);font-size:13px;line-height:1.3}
.fg-tile .badge{grid-row:span 2}
.fg-tile .tk{position:absolute;top:9px;right:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--gon);background:var(--ga);transform:scale(0);transition:transform .18s}
.fg-tile[aria-pressed=true]{background:rgba(61,220,151,.12);border-color:var(--ga);box-shadow:0 0 0 3px rgba(61,220,151,.15)}
.fg-tile[aria-pressed=true] .tk{transform:scale(1)}
.fg button:focus-visible,.fgd button:focus-visible,.fg-modal button:focus-visible{outline:3px solid var(--gw);outline-offset:2px}
.fg-load{display:grid;place-items:center;gap:14px;padding:30px 0;text-align:center}
.fg-spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.14);border-top-color:var(--ga);animation:fgspin .8s linear infinite}
/* dashboard + profile (inside the existing page) */
.fgd{position:relative;overflow:hidden;margin-top:18px;border-radius:26px;padding:24px;color:var(--gt);background:radial-gradient(700px 420px at 0 -20%,#12633f 0%,transparent 60%),linear-gradient(160deg,#08261b,#041510);border:1px solid var(--gl);box-shadow:0 24px 60px rgba(2,20,12,.35);animation:fgin .45s both}
.fgd h1,.fgd h2,.fgd h3{color:var(--gt);margin:0}
.fgd p{color:var(--gm);margin:0}
.fgd-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center}
.fgd-pill{display:inline-block;font:700 12px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#bff5d9;background:rgba(61,220,151,.12);border:1px solid var(--gl);border-radius:99px;padding:5px 12px;margin-bottom:12px!important}
.fgd-hi{font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.025em;margin:0 0 8px!important;word-break:break-word}

sql:[
["Read a table","SELECT picks data. * means all columns. The table is students (name, age).",`SELECT * FROM students;`,`Every row of students.`],
["One column","Name the column you want.",`SELECT name FROM students;`,`Only the name column.`],
["Two columns","Separate columns with commas.",`SELECT name, age FROM students;`,`The name and age columns.`],
["Limit rows","LIMIT shows only the first few rows.",`SELECT * FROM students LIMIT 3;`,`The first 3 rows.`],
["No repeats","DISTINCT removes repeated values.",`SELECT DISTINCT age FROM students;`,`Each age once.`],
["Filter rows","WHERE keeps only matching rows.",`SELECT name FROM students WHERE age > 18;`,`Names of students older than 18.`],
["Exact match","= checks for an exact value.",`SELECT * FROM students WHERE age = 20;`,`Students aged 20.`],
["Two rules","AND needs both rules to be true.",`SELECT * FROM students WHERE age > 18 AND age < 25;`,`Students between 19 and 24.`],
["Sort","ORDER BY sorts the rows.",`SELECT name FROM students ORDER BY age;`,`Names, youngest first.`],
["Sort backwards","DESC sorts from big to small.",`SELECT name FROM students ORDER BY age DESC;`,`Names, oldest first.`],
["Add a row","INSERT INTO adds a row.",`INSERT INTO students (name, age) VALUES ('Ana', 20);`,`A new row: Ana, 20.`],
["Change a row","UPDATE changes values. Always use WHERE.",`UPDATE students SET age = 21 WHERE name = 'Ana';`,`Ana's age becomes 21.`],
["Delete a row","DELETE removes rows. Always use WHERE.",`DELETE FROM students WHERE name = 'Ana';`,`Ana's row is removed.`],
["Count rows","COUNT counts rows.",`SELECT COUNT(*) FROM students;`,`The number of students.`],
["Average","AVG finds the average.",`SELECT AVG(age) FROM students;`,`The average age.`],
["Match a pattern","LIKE with % matches any letters.",`SELECT * FROM students WHERE name LIKE 'A%';`,`Students whose name starts with A.`],
["Group","GROUP BY makes one result per group.",`SELECT age, COUNT(*) FROM students GROUP BY age;`,`How many students have each age.`],
["Create a table","CREATE TABLE makes a new table.",`CREATE TABLE courses (
  id INT,
  title TEXT
);`,`A new empty table named courses.`],
["Join tables","JOIN connects two tables.",`SELECT students.name, courses.title
FROM students
JOIN courses ON students.course_id = courses.id;`,`Each student next to their course title.`],
["Filter groups","HAVING filters groups after GROUP BY.",`SELECT age, COUNT(*) FROM students GROUP BY age HAVING COUNT(*) > 1;`,`Ages shared by more than one student.`]]};

<div class="sec"><h2>Coding</h2><span>20 lessons each, easy to hard</span></div><div class="grid">`+["html","py","js","sql","css","c","cpp"].map(card).join("")+`</div><div class="sec"><h2>Office skills</h2><span>Step-by-step practice</span></div><div class="grid">`+["ppt","excel","word"].map(card).join("")+`</div><div class="sec"><h2>How it works</h2></div><div class="how"><div><b>1. Read</b><span>Open a subject and read the short syllabus.</span></div><div><b>2. Type or click</b><span>Each lesson shows exactly what to do.</span></div><div><b>3. Check</b><span>Get instant feedback and earn XP.</span></div></div><footer class="f">Bytely · Learn at your own speed. Progress is saved in this browser.</footer>`}

if(!RM)setInterval(()=>{const t=$("typ"),r=$("typr");if(!t)return;const d=DEMO[di];if(ci<=d[0].length){t.textContent=d[0].slice(0,ci++);r.textContent=""}else if(ci<=d[0].length+16){ci++;r.textContent="✓ "+d[1]}else{ci=0;di=(di+1)%DEMO.length}},85);

function readForm(form,needConsent){var fd=new FormData(form),g=function(k){return String(fd.get(k)==null?'':fd.get(k));};
 var name=g('name').trim().replace(/\s+/g,' '),course=g('course'),other=g('courseOther').trim(),year=g('year'),exp=g('experience'),goal=g('goal').trim(),col=g('college').trim().replace(/\s+/g,' ');
 var err=null,field=null;
 if(!NAME_RE.test(name)){err='Enter your full name (2 to 60 letters; spaces, dots, hyphens and apostrophes are fine).';field='fName';}
 else if(!course){err='Choose the course you are pursuing.';field='fCourse';}
 else if(course==='Other'&&other.length<2){err='Type the name of your course.';field='fOther';}
 else if(YEARS.indexOf(year)<0){err='Select your year of study.';field=null;}
 else if(col.length>100){err='College name is too long (maximum 100 characters).';field='fCol';}
 else if(EXPS.indexOf(exp)<0){err='Select your programming experience.';field=null;}
 else if(goal.length<2){err='Tell us what you want to learn (at least a few words).';field='fGoal';}
 else if(goal.length>300){err='Please keep this under 300 characters.';field='fGoal';}
 else if(needConsent&&!form.querySelector('[name=consent]').checked){err='Please accept the privacy notice to continue.';field=null;}
 if(err)return{err:err,field:field};
 return{v:{name:name,course:course==='Other'?other:course,year:year,college:col,experience:exp,goal:goal}};}

function makeVerifier(){try{if(AU.verifier)AU.verifier.clear();}catch(e){}
 var holder=document.getElementById('recaptcha-container');holder.innerHTML='';var d=document.createElement('div');holder.appendChild(d);
 AU.verifier=new firebase.auth.RecaptchaVerifier(d,{size:'invisible'});return AU.verifier;}
function sendOtp(){return AU.auth.signInWithPhoneNumber(AU.e164,makeVerifier()).then(function(r){AU.confirm=r;AU.fails=0;});}
function resetVerifier(){try{if(AU.verifier)AU.verifier.clear();}catch(e){}AU.verifier=null;}

function submitPhone(){var cc=document.getElementById('fgCc').value,raw=document.getElementById('fgNum').value,btn=document.getElementById('fgSend');

 showErr('fgE','');AU.e164=r.e164;AU.local=r.local;setBusy(btn,true,'Sending OTP…');
 sendOtp().then(function(){goOtp();}).catch(function(e){resetVerifier();setBusy(btn,false);showErr('fgE',errMsg(e));});}

 sendOtp().then(function(){AU.busy=false;goOtp('A new code has been sent.');}).catch(function(e){AU.busy=false;resetVerifier();showErr('fgE',errMsg(e));if(n)n.classList.remove('on');});}
function code(){return[].map.call(document.querySelectorAll('.fg-otp input'),function(i){return i.value;}).join('');}
function submitOtp(){if(AU.busy)return;var c=code(),btn=document.getElementById('fgVerify');
 if(!/^\d{6}$/.test(c)){showErr('fgE','Enter the 6-digit code.');return;}
 if(!AU.confirm){showErr('fgE','Please request a new code.');return;}
 if(AU.fails>=5){showErr('fgE','Too many wrong codes. Tap Resend OTP to get a new code.');return;}
 AU.busy=true;showErr('fgE','');setBusy(btn,true,'Verifying…');
 AU.confirm.confirm(c).then(function(){AU.busy=false;stopTimer();/* onAuthStateChanged routes next */}).catch(function(e){AU.busy=false;AU.fails++;setBusy(btn,false);
  showErr('fgE',errMsg(e));var ins=document.querySelectorAll('.fg-otp input');[].forEach.call(ins,function(i){i.value='';});if(ins[0])ins[0].focus();});}

 return profileDoc().get().then(function(s){if(!AU.user||AU.user.uid!==u.uid)return;

 }).catch(function(e){goError(errMsg(e),'Try again');});}
function createProfile(){var u=AU.user,d=AU.draft,TS=firebase.firestore.FieldValue.serverTimestamp;
 var data={name:d.name,phone:u.phoneNumber,course:d.course,year:d.year,college:d.college||'',experience:d.experience,goal:d.goal,interests:d.interests.slice(),createdAt:TS(),updatedAt:TS()};
 var sRef=profileDoc(),pRef=AU.db.collection('phoneIndex').doc(u.phoneNumber);
 return AU.db.runTransaction(function(tx){return tx.get(pRef).then(function(p){
  if(p.exists&&p.data().uid!==u.uid){var er=new Error('dup');er.code='app/duplicate-phone';throw er;}
  tx.set(sRef,data);if(!p.exists)tx.set(pRef,{uid:u.uid,createdAt:TS()});});})
 .then(function(){return sRef.get();}).then(function(s){AU.profile=s.data();});}

 m.innerHTML='<div><h2 id="fgPT">Privacy notice</h2><p>Bytely is a learning website for students. This notice explains what we save and why.</p>'

 document.body.appendChild(m);var b=m.querySelector('button');if(b)b.focus();}

/* ---------- events ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-au]');if(!b)return;var a=b.dataset.au;
 if(a==='start')goPhone();
 else if(a==='home')goWelcome();
 else if(a==='guest')guestEnter();
 else if(a==='changenum'){stopTimer();resetVerifier();AU.confirm=null;goPhone();}
 else if(a==='resend')resend();
 else if(a==='signout')signOut();
 else if(a==='retry'){if(AU.user)goBoot('Loading your profile…'),loadProfile();else location.reload();}
 else if(a==='privacy')openPrivacy();
 else if(a==='closemodal')closePrivacy();
 else if(a==='toggleint'){var k=b.dataset.k,l=AU.draft.interests||(AU.draft.interests=[]),ix=l.indexOf(k);if(ix>=0)l.splice(ix,1);else l.push(k);b.setAttribute('aria-pressed',ix<0);paintSel();showErr('fgE','');}
 else if(a==='finish')finish();
 else if(a==='backreg')goRegister();
 else if(a==='goedit'){st={v:'edit'};render();}
 else if(a==='forgetcfg'){try{localStorage.removeItem(STORE_KEY);}catch(e){}location.reload();}
 else if(a==='gopref'){st={v:'pref'};render();}
 else if(a==='saveprefs')savePrefs();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePrivacy();
 var t=e.target;if(t&&t.closest&&t.closest('.fg-otp')){var ins=[].slice.call(document.querySelectorAll('.fg-otp input')),i=ins.indexOf(t);
  if(e.key==='Backspace'&&!t.value&&i>0){ins[i-1].focus();ins[i-1].value='';}
  else if(e.key==='ArrowLeft'&&i>0)ins[i-1].focus();else if(e.key==='ArrowRight'&&i<5)ins[i+1].focus();}});
document.addEventListener('input',function(e){var t=e.target;if(!t.closest||!t.closest('.fg-otp'))return;
 var ins=[].slice.call(document.querySelectorAll('.fg-otp input')),i=ins.indexOf(t);t.value=t.value.replace(/\D/g,'').slice(-1);
 if(t.value&&i<5)ins[i+1].focus();if(code().length===6)submitOtp();});
document.addEventListener('paste',function(e){var t=e.target;if(!t.closest||!t.closest('.fg-otp'))return;
 var d=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\D/g,'').slice(0,6);if(!d)return;e.preventDefault();
 var ins=document.querySelectorAll('.fg-otp input');for(var i=0;i<6;i++)ins[i].value=d.charAt(i)||'';(ins[Math.min(d.length,5)]).focus();if(d.length===6)submitOtp();});
document.addEventListener('submit',function(e){var f=e.target;if(!f||!f.id)return;
 if(f.id==='fgPhone'){e.preventDefault();submitPhone();}
 else if(f.id==='fgOtp'){e.preventDefault();submitOtp();}
 else if(f.id==='fgReg'){e.preventDefault();var r=readForm(f,true);if(r.err){showErr('fgE',r.err);if(r.field)document.getElementById(r.field).focus();return;}
  AU.draft=Object.assign({},AU.draft,r.v,{_consent:true});goInterests();}
 else if(f.id==='fgEdit'){e.preventDefault();saveEdit(f);}
 else if(f.id==='fgCfg'){e.preventDefault();var r2=parseConfig(document.getElementById('fgCfgTxt').value);if(r2.err){showErr('fgE',r2.err);return;}
  try{localStorage.setItem(STORE_KEY,JSON.stringify(r2.cfg));}catch(x){showErr('fgE','Your browser blocked saving. Allow site data and try again.');return;}location.reload();}});

/* ---------- boot ---------- */
function onUser(user){AU.user=user||null;
 if(!user){leaveApp();goWelcome();return;}
 if(AU.step!=='register'&&AU.step!=='interests')goBoot('Signing you in…');
 loadProfile();}
function boot(){
 if(!configured){goWelcome();return;}
 if(!window.firebase||!firebase.auth||!firebase.firestore){goError('Could not load the sign-in service. Check your internet connection and try again.','Reload');return;}
 goBoot('Checking your session…');
 try{firebase.initializeApp(CFG);AU.auth=firebase.auth();AU.db=firebase.firestore();try{AU.auth.useDeviceLanguage();}catch(e){}}
 catch(e){goError('The Firebase configuration is not valid. Check firebase-config.js.','Reload');return;}
 var go=function(){AU.auth.onAuthStateChanged(onUser,function(e){goError(errMsg(e),'Reload');});};
 AU.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(go,go);}
boot();
})();
</script></body></html>
